<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin 🔒 | Scrapbook Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --primary: #6b2d3a;
            --primary-light: #fbe8e7;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --accent-pink: #e11d48;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 2.5rem 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            text-align: center;
        }

        .lock-icon {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }

        .login-card h2 {
            font-size: 1.6rem;
            color: var(--primary);
            margin-bottom: 0.4rem;
        }

        .login-card p {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 1.8rem;
        }

        .error-message {
            background-color: #fef2f2;
            color: var(--accent-pink);
            border: 1px solid #fecaca;
            padding: 0.75rem;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1.2rem;
            font-weight: 500;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            text-align: left;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
        }

        .form-group input {
            padding: 0.8rem 1rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(107, 45, 58, 0.15);
        }

        .btn-login {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.9rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        .btn-login:hover {
            background: #52212c;
        }

        .back-home {
            margin-top: 1.5rem;
            font-size: 0.85rem;
        }

        .back-home a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .back-home a:hover {
            text-decoration: underline;
        }

        /* Dark mode (mengikuti tema perangkat) */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #171214;
                --primary: #E8A7A1;
                --primary-light: #3A2C2A;
                --text-dark: #F1E7E1;
                --text-muted: #B5A09A;
                --accent-pink: #f4708b;
            }
            .login-card { background: #241E1C; border-color: #3A3230; }
            .form-group input { background-color: #1E1918; color: var(--text-dark); border-color: #4A403C; }
            .btn-login { background: #8A4650; color: white; }
            .btn-login:hover { background: #6E3A42; }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="lock-icon">🔒</div>
        <h2>Admin Dashboard Login</h2>
        <p>Masukkan username dan password admin untuk mengakses halaman monitoring.</p>

        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <form action="/admin/login" method="POST" class="login-form">
            <div class="form-group">
                <label for="username">Username Admin:</label>
                <input type="text" id="username" name="username" placeholder="Masukkan username..." required autofocus autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Password Admin:</label>
                <input type="password" id="password" name="password" placeholder="Masukkan password..." required>
            </div>

            <button type="submit" class="btn-login">Masuk Dashboard 🚀</button>
        </form>

        <div class="back-home">
            <a href="/">← Kembali ke Website Scrapbook</a>
        </div>
    </div>

</body>
</html>
